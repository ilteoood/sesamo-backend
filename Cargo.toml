[package]
name = "sesamo-backend"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.14.0"
env_logger = "0.11.11"
firestore = { version = "0.49.0", features = ["caching-memory"] }
futures = "0.3.33"
itertools = "0.15.0"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
openssl = { version = "0.10.81", features = ["vendored"] }
reqwest = { version = "0.13.4", features = ["form"] }
rustls = { version = "0.23.42", features = ["aws-lc-rs"] }
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync"] }

[dev-dependencies]
tokio-shared-rt = "0.1.0"
